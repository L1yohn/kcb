<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>我的课程表 - 手机移动端查询系统</title>
  <meta name="description" content="专为手机端优化的大学课程表查询系统，支持周次切换、实时日程、周视图网格与日历导出。">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">
  <style>
/* ==========================================================================
   课程表 Web App - 现代化移动端与响应式样式
   ========================================================================== */

:root {
  --primary: #4f46e5;
  --primary-hover: #4338ca;
  --primary-light: #eef2ff;
  --accent: #06b6d4;
  --bg-main: #f8fafc;
  --bg-card: #ffffff;
  --bg-card-subtle: #f1f5f9;
  --bg-card-hover: #f8fafc;
  --text-main: #0f172a;
  --text-muted: #64748b;
  --text-light: #94a3b8;
  --border-color: #e2e8f0;
  --border-subtle: #f1f5f9;
  --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
  --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
  --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 18px;
  --radius-full: 9999px;
  --tab-bar-height: 64px;
  --header-height: 56px;
  --font-sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", Roboto, "Hiragino Sans GB", "Microsoft YaHei", "WenQuanYi Micro Hei", "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
}

[data-theme="dark"] {
  --primary: #6366f1;
  --primary-hover: #4f46e5;
  --primary-light: rgba(99, 102, 241, 0.15);
  --accent: #22d3ee;
  --bg-main: #090d16;
  --bg-card: #131b2e;
  --bg-card-subtle: #1e293b;
  --bg-card-hover: #1e293b;
  --text-main: #f8fafc;
  --text-muted: #94a3b8;
  --text-light: #64748b;
  --border-color: #1e293b;
  --border-subtle: #172033;
  --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.3);
  --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.4);
  --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.5);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

body {
  font-family: var(--font-sans);
  background-color: var(--bg-main);
  color: var(--text-main);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  overflow-x: hidden;
  font-size: 14px;
  line-height: 1.5;
  transition: background-color 0.3s ease, color 0.3s ease;
}

/* 整体移动端容器约束 (在PC端自适应为居中手机卡片，在手机端全屏铺满) */
.app-container {
  width: 100%;
  max-width: 520px;
  min-height: 100vh;
  background-color: var(--bg-main);
  display: flex;
  flex-direction: column;
  position: relative;
  box-shadow: 0 0 50px rgba(0, 0, 0, 0.05);
  padding-bottom: calc(var(--tab-bar-height) + 16px);
}

@media (min-width: 768px) {
  .app-container {
    max-width: 600px;
  }
}

/* ==========================================
   顶部导航与周次切换
   ========================================== */
.app-header {
  position: sticky;
  top: 0;
  z-index: 40;
  background: var(--bg-card);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border-color);
  padding: 12px 16px 8px;
}

.header-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}

.brand-info {
  display: flex;
  align-items: center;
  gap: 8px;
}

.brand-icon {
  width: 32px;
  height: 32px;
  border-radius: var(--radius-sm);
  background: linear-gradient(135deg, var(--primary), var(--accent));
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  font-weight: bold;
}

.brand-title {
  font-size: 17px;
  font-weight: 700;
  letter-spacing: -0.3px;
  color: var(--text-main);
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.icon-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 1px solid var(--border-color);
  background: var(--bg-card);
  color: var(--text-muted);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.2s ease;
  font-size: 16px;
}

.icon-btn:hover, .icon-btn:active {
  background: var(--bg-card-subtle);
  color: var(--primary);
  transform: scale(0.96);
}

/* 周次快速横向滑动选择栏 */
.week-scroller-container {
  display: flex;
  align-items: center;
  gap: 6px;
  overflow-x: auto;
  padding: 4px 0 2px;
  scrollbar-width: none;
  -ms-overflow-style: none;
}

.week-scroller-container::-webkit-scrollbar {
  display: none;
}

.week-pill {
  flex-shrink: 0;
  padding: 5px 12px;
  border-radius: var(--radius-full);
  font-size: 12px;
  font-weight: 500;
  background: var(--bg-card-subtle);
  color: var(--text-muted);
  border: 1px solid transparent;
  cursor: pointer;
  transition: all 0.2s ease;
  white-space: nowrap;
}

.week-pill.active {
  background: var(--primary);
  color: #ffffff;
  font-weight: 600;
  box-shadow: 0 2px 8px rgba(79, 70, 229, 0.35);
}

.week-pill.current-tag {
  border-color: var(--primary);
}

/* ==========================================
   页面视图主体
   ========================================== */
.view-content {
  flex: 1;
  padding: 12px 14px;
  display: none;
}

.view-content.active {
  display: block;
  animation: fadeIn 0.25s ease forwards;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ==========================================
   视图 1: 今日视图 (Today View)
   ========================================== */
.today-summary-card {
  background: linear-gradient(135deg, var(--primary), #3730a3);
  color: white;
  border-radius: var(--radius-lg);
  padding: 18px;
  margin-bottom: 16px;
  box-shadow: 0 8px 20px -4px rgba(79, 70, 229, 0.4);
  position: relative;
  overflow: hidden;
}

[data-theme="dark"] .today-summary-card {
  background: linear-gradient(135deg, #4338ca, #1e1b4b);
}

.today-summary-card::after {
  content: '📚';
  position: absolute;
  right: -10px;
  bottom: -15px;
  font-size: 84px;
  opacity: 0.15;
  pointer-events: none;
}

.today-date-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}

.today-date {
  font-size: 18px;
  font-weight: 700;
}

.today-week-badge {
  background: rgba(255, 255, 255, 0.2);
  backdrop-filter: blur(8px);
  padding: 4px 10px;
  border-radius: var(--radius-full);
  font-size: 11px;
  font-weight: 600;
}

.today-status-text {
  font-size: 13px;
  opacity: 0.9;
  margin-top: 4px;
}

/* 星期快捷切换器 */
.weekday-switcher {
  display: flex;
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  padding: 4px;
  margin-bottom: 16px;
  box-shadow: var(--shadow-sm);
  justify-content: space-between;
}

.weekday-btn {
  flex: 1;
  text-align: center;
  padding: 8px 2px;
  border-radius: var(--radius-sm);
  background: transparent;
  border: none;
  font-size: 12px;
  font-weight: 500;
  color: var(--text-muted);
  cursor: pointer;
  transition: all 0.2s;
}

.weekday-btn.active {
  background: var(--primary-light);
  color: var(--primary);
  font-weight: 700;
}

.weekday-btn.today-highlight {
  position: relative;
}

.weekday-btn.today-highlight::after {
  content: '';
  position: absolute;
  bottom: 2px;
  left: 50%;
  transform: translateX(-50%);
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--primary);
}

/* 今日课程时间轴卡片 */
.timeline-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.course-item-card {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  padding: 14px 16px;
  box-shadow: var(--shadow-sm);
  display: flex;
  gap: 14px;
  position: relative;
  transition: transform 0.2s, box-shadow 0.2s;
  cursor: pointer;
}

.course-item-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
}

.course-item-card.is-inactive {
  opacity: 0.55;
  background: var(--bg-card-subtle);
  border-style: dashed;
}

.course-item-left {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-width: 65px;
  padding-right: 12px;
  border-right: 1px dashed var(--border-color);
}

.time-slot-name {
  font-size: 14px;
  font-weight: 700;
  color: var(--text-main);
}

.time-slot-range {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 2px;
}

.course-item-body {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.course-header-row {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 6px;
}

.course-title {
  font-size: 15px;
  font-weight: 700;
  color: var(--text-main);
  line-height: 1.3;
}

.course-tag {
  font-size: 10px;
  padding: 2px 6px;
  border-radius: var(--radius-sm);
  white-space: nowrap;
  font-weight: 600;
}

.course-meta-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px;
  font-size: 12px;
  color: var(--text-muted);
}

.meta-item {
  display: flex;
  align-items: center;
  gap: 4px;
}

.meta-icon {
  font-size: 12px;
}

.empty-course-state {
  text-align: center;
  padding: 48px 16px;
  color: var(--text-muted);
  background: var(--bg-card);
  border-radius: var(--radius-md);
  border: 1px dashed var(--border-color);
}

.empty-icon {
  font-size: 42px;
  margin-bottom: 12px;
}

/* ==========================================
   视图 2: 周课表网格 (Weekly Grid View)
   ========================================== */
.grid-controls-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
  gap: 8px;
}

.grid-filter-btn {
  font-size: 12px;
  padding: 6px 12px;
  border-radius: var(--radius-full);
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  color: var(--text-muted);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 4px;
}

.grid-filter-btn.active {
  background: var(--primary-light);
  color: var(--primary);
  border-color: var(--primary);
  font-weight: 600;
}

.timetable-scroll-wrapper {
  width: 100%;
  overflow-x: auto;
  border-radius: var(--radius-md);
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  box-shadow: var(--shadow-sm);
}

.timetable-grid {
  display: grid;
  grid-template-columns: 38px repeat(5, minmax(68px, 1fr));
  min-width: 380px;
  border-collapse: collapse;
}

.show-weekends .timetable-grid {
  grid-template-columns: 38px repeat(7, minmax(60px, 1fr));
  min-width: 460px;
}

.grid-header-cell {
  background: var(--bg-card-subtle);
  padding: 8px 2px;
  text-align: center;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-muted);
  border-bottom: 1px solid var(--border-color);
  border-right: 1px solid var(--border-color);
}

.grid-header-cell:last-child {
  border-right: none;
}

.grid-header-cell.is-today {
  color: var(--primary);
  background: var(--primary-light);
  font-weight: 700;
}

.grid-time-cell {
  background: var(--bg-card-subtle);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 4px 2px;
  border-bottom: 1px solid var(--border-color);
  border-right: 1px solid var(--border-color);
  font-size: 11px;
  font-weight: 700;
  color: var(--text-muted);
  min-height: 84px;
}

.grid-time-slot {
  font-size: 9px;
  color: var(--text-light);
  transform: scale(0.9);
}

.grid-course-slot {
  position: relative;
  padding: 3px;
  border-bottom: 1px solid var(--border-color);
  border-right: 1px solid var(--border-color);
  min-height: 84px;
  background: var(--bg-card);
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.grid-course-slot:last-child {
  border-right: none;
}

/* 课表小格内卡片 */
.grid-card {
  flex: 1;
  border-radius: var(--radius-sm);
  padding: 5px 4px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  cursor: pointer;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
  overflow: hidden;
  border: 1px solid transparent;
}

.grid-card:active {
  transform: scale(0.95);
}

.grid-card-name {
  font-size: 11px;
  font-weight: 700;
  line-height: 1.25;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.grid-card-room {
  font-size: 9px;
  font-weight: 600;
  opacity: 0.85;
  margin-top: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.grid-card.inactive-week {
  opacity: 0.38;
  filter: grayscale(0.6);
  border: 1px dashed var(--text-light);
}

/* ==========================================
   底部 Tab 导航栏
   ========================================== */
.bottom-tab-bar {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 520px;
  height: var(--tab-bar-height);
  background: var(--bg-card);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-top: 1px solid var(--border-color);
  display: flex;
  justify-content: space-around;
  align-items: center;
  z-index: 50;
  padding-bottom: env(safe-area-inset-bottom);
}

@media (min-width: 768px) {
  .bottom-tab-bar {
    max-width: 600px;
  }
}

.tab-btn {
  flex: 1;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  transition: all 0.2s;
  gap: 3px;
}

.tab-icon {
  font-size: 20px;
  transition: transform 0.2s;
}

.tab-label {
  font-size: 11px;
  font-weight: 500;
}

.tab-btn.active {
  color: var(--primary);
}

.tab-btn.active .tab-icon {
  transform: scale(1.15);
}

/* ==========================================
   弹窗与抽屉 (Modal & Bottom Sheet)
   ========================================== */
.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0, 0, 0, 0.45);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  z-index: 100;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease;
}

.modal-overlay.active {
  opacity: 1;
  pointer-events: auto;
}

.modal-sheet {
  width: 100%;
  max-width: 520px;
  background: var(--bg-card);
  border-radius: 20px 20px 0 0;
  padding: 20px;
  max-height: 85vh;
  overflow-y: auto;
  transform: translateY(100%);
  transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}

.modal-overlay.active .modal-sheet {
  transform: translateY(0);
}

.sheet-handle {
  width: 36px;
  height: 4px;
  background: var(--border-color);
  border-radius: 2px;
  margin: 0 auto 16px;
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 16px;
}

.modal-title {
  font-size: 18px;
  font-weight: 800;
  color: var(--text-main);
  line-height: 1.3;
}

.modal-close-btn {
  background: var(--bg-card-subtle);
  border: none;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 16px;
}

.detail-item-card {
  background: var(--bg-card-subtle);
  border-radius: var(--radius-md);
  padding: 12px 14px;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.detail-icon {
  font-size: 20px;
  color: var(--primary);
}

.detail-label {
  font-size: 11px;
  color: var(--text-muted);
}

.detail-val {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-main);
}

.qr-preview-box {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: #ffffff;
  border-radius: var(--radius-md);
  margin: 10px 0;
}

.qr-tip {
  font-size: 12px;
  color: var(--text-muted);
  text-align: center;
  margin-top: 8px;
}

.primary-btn {
  width: 100%;
  padding: 12px;
  background: var(--primary);
  color: #ffffff;
  border: none;
  border-radius: var(--radius-md);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
  transition: all 0.2s;
  margin-top: 10px;
}

.secondary-btn {
  width: 100%;
  padding: 10px;
  background: var(--bg-card-subtle);
  color: var(--text-main);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: all 0.2s;
  margin-top: 8px;
}
  </style>
</head>
<body>

  <div class="app-container">
    <!-- 顶部导航栏 -->
    <header class="app-header">
      <div class="header-top">
        <div class="brand-info">
          <div class="brand-icon">📚</div>
          <div class="brand-title">学期课程表</div>
        </div>
        <div class="header-actions">
          <button class="icon-btn" id="share-btn" title="手机扫码查看" aria-label="手机扫码查看">📱</button>
          <button class="icon-btn" id="theme-toggle-btn" title="切换暗黑/浅色模式" aria-label="切换主题">🌓</button>
        </div>
      </div>

      <!-- 顶部周次快捷滑动选择条 -->
      <div id="week-scroller-wrap" class="week-scroller-container">
        <div id="week-scroller" class="week-scroller-container"></div>
      </div>
    </header>

    <!-- 视图 1: 今日日程 (Today View) -->
    <main id="view-today" class="view-content active">
      <div id="today-summary-box" class="today-summary-card"></div>

      <!-- 星期一 ~ 星期日 快捷切换按钮 -->
      <div id="weekday-switcher" class="weekday-switcher"></div>

      <!-- 课程卡片时间轴列表 -->
      <div id="today-course-list" class="timeline-list"></div>
    </main>

    <!-- 视图 2: 周课表网格 (Weekly Grid View) -->
    <main id="view-week" class="view-content">
      <div class="grid-controls-bar">
        <span style="font-size: 13px; font-weight: 600; color: var(--text-muted);">🗓️ 本周全景课表</span>
        <button class="grid-filter-btn active" id="grid-toggle-filter" onclick="
          window.state = window.state || {};
          this.classList.toggle('active');
          const isOnly = this.classList.contains('active');
          this.innerText = isOnly ? '✅ 仅看本周有课' : '👀 显示所有周课程';
        ">
          ✅ 仅看本周有课
        </button>
      </div>

      <div id="timetable-scroll-wrapper" class="timetable-scroll-wrapper">
        <div id="timetable-grid-content" class="timetable-grid"></div>
      </div>
    </main>

    <!-- 底部 Tab 导航栏 -->
    <nav class="bottom-tab-bar">
      <button class="tab-btn active" data-tab="today">
        <span class="tab-icon">📅</span>
        <span class="tab-label">今日日程</span>
      </button>
      <button class="tab-btn" data-tab="week">
        <span class="tab-icon">🗓️</span>
        <span class="tab-label">周课表</span>
      </button>
    </nav>
  </div>

  <!-- 课程详情弹窗 Modal (Bottom Sheet) -->
  <div id="course-detail-modal" class="modal-overlay">
    <div class="modal-sheet">
      <div class="sheet-handle"></div>
      <div class="modal-header">
        <div class="modal-title" id="detail-modal-title">课程详情</div>
        <button class="modal-close-btn" aria-label="关闭">&times;</button>
      </div>
      <div id="detail-modal-content"></div>
    </div>
  </div>

  <!-- 手机扫码分享弹窗 -->
  <div id="share-modal" class="modal-overlay">
    <div class="modal-sheet">
      <div class="sheet-handle"></div>
      <div class="modal-header">
        <div class="modal-title">📱 手机扫码访问</div>
        <button class="modal-close-btn" aria-label="关闭">&times;</button>
      </div>
      <div class="qr-preview-box" id="share-qr-code"></div>
      <div style="font-size: 11px; color: var(--text-muted); word-break: break-all; text-align: center; margin-top: 6px;" id="share-url-text"></div>
      <button class="secondary-btn" onclick="document.getElementById('share-modal').classList.remove('active')">关闭</button>
    </div>
  </div>

  <!-- 引入 JavaScript 脚本 (带时间戳防缓存) -->
  <script src="js/qrcode.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/ics.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
