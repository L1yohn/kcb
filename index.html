<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover">
  <title>我的课程表 - 手机移动端查询系统</title>
  <meta name="description" content="专为手机端优化的大学课程表查询系统，支持周次切换、实时日程、周视图网格与日历导出。">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">
  <style>
/* ==========================================================================
   Anthropic / Claude Aesthetic - Warm Minimalist Design System
   "warm minimalism + editorial typography + generous whitespace + restrained interaction"
   ========================================================================== */

:root {
  /* Warm Neutral Palette */
  --bg-main: #F7F6F2;
  --bg-surface: #FFFFFF;
  --bg-subtle: #EFECE6;
  --bg-muted: #E6E2D8;
  --text-primary: #262522;
  --text-secondary: #6F6D67;
  --text-tertiary: #9A978F;
  --border-color: #E5E2DB;
  --border-subtle: #EDEAE3;

  /* Terracotta Accent */
  --accent: #C96A3D;
  --accent-hover: #B85C32;
  --accent-light: #FAF2EE;
  --accent-border: #E8D5CB;

  /* Status Colors */
  --status-ongoing: #C96A3D;
  --status-upcoming: #8A6D3B;
  --status-holiday: #A64434;

  /* Typography */
  --font-sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", Roboto, "Hiragino Sans GB", "Microsoft YaHei", "WenQuanYi Micro Hei", sans-serif;
  --font-serif: "Newsreader", "Georgia", "Songti SC", "SimSun", serif;

  /* Geometry */
  --radius-xs: 4px;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-full: 9999px;
  --btn-height: 42px;
  --content-max-width: 1140px;
  --tab-bar-height: 64px;
}

[data-theme="dark"] {
  --bg-main: #181715;
  --bg-surface: #22201D;
  --bg-subtle: #2C2A26;
  --bg-muted: #373530;
  --text-primary: #EDEAE4;
  --text-secondary: #9E9B93;
  --text-tertiary: #6E6B64;
  --border-color: #33312B;
  --border-subtle: #292723;

  --accent: #D97748;
  --accent-hover: #E28456;
  --accent-light: rgba(217, 119, 72, 0.12);
  --accent-border: #4D3324;

  --status-ongoing: #D97748;
  --status-upcoming: #D4A853;
  --status-holiday: #D66353;
}

/* Base Reset */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body {
  font-family: var(--font-sans);
  background-color: var(--bg-main);
  color: var(--text-primary);
  min-height: 100vh;
  font-size: 15px;
  line-height: 1.65;
  letter-spacing: -0.012em;
  transition: background-color 0.2s ease-out, color 0.2s ease-out;
  display: flex;
  justify-content: center;
}

button, a, .course-item-card, .grid-card, .weekday-btn, .week-pill {
  touch-action: manipulation;
}

/* App Container - Spacious Editorial Canvas */
.app-container {
  width: 100%;
  max-width: var(--content-max-width);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  padding: 0 16px;
  padding-bottom: calc(var(--tab-bar-height) + 24px);
  position: relative;
}

@media (min-width: 768px) {
  .app-container {
    padding: 0 36px;
    padding-bottom: 56px;
  }
}

/* ==========================================
   顶部导航栏 (Header)
   ========================================== */
.app-header {
  position: sticky;
  top: 0;
  z-index: 50;
  background: var(--bg-main);
  border-bottom: 1px solid var(--border-color);
  padding: 16px 0 12px;
  margin-bottom: 24px;
  transition: background-color 0.2s ease-out, border-color 0.2s ease-out;
}

.header-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}

.brand-info {
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand-icon {
  width: 36px;
  height: 36px;
  border-radius: var(--radius-sm);
  background: var(--bg-surface);
  border: 1px solid var(--border-color);
  color: var(--accent);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
}

.brand-title-wrap {
  display: flex;
  flex-direction: column;
}

.brand-title {
  font-size: 17px;
  font-weight: 600;
  color: var(--text-primary);
  letter-spacing: -0.02em;
}

.brand-subtitle {
  font-size: 11px;
  color: var(--text-secondary);
  font-weight: 400;
  margin-top: -1px;
}

/* 桌面端居中 Tab 导航 */
.desktop-tab-nav {
  display: none;
  background: var(--bg-subtle);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-md);
  padding: 3px;
  gap: 4px;
}

@media (min-width: 768px) {
  .desktop-tab-nav {
    display: flex;
    align-items: center;
  }
}

.desktop-tab-nav .tab-btn {
  border: none;
  background: transparent;
  padding: 6px 18px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: all 0.18s ease-out;
}

.desktop-tab-nav .tab-btn:hover {
  color: var(--text-primary);
}

.desktop-tab-nav .tab-btn.active {
  background: var(--bg-surface);
  color: var(--text-primary);
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
  font-weight: 600;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.icon-btn {
  background: var(--bg-surface);
  border: 1px solid var(--border-color);
  color: var(--text-primary);
  width: 36px;
  height: 36px;
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  cursor: pointer;
  transition: background-color 0.18s ease-out, border-color 0.18s ease-out;
}

.icon-btn:hover {
  background: var(--bg-subtle);
  border-color: var(--text-tertiary);
}

/* 周次水平选择条 */
.week-scroller-wrap {
  width: 100%;
}

.week-scroller-container {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 2px 0 4px;
  scrollbar-width: none;
  -ms-overflow-style: none;
  -webkit-overflow-scrolling: touch;
}

.week-scroller-container::-webkit-scrollbar {
  display: none;
}

.week-pill {
  flex-shrink: 0;
  padding: 6px 14px;
  border-radius: var(--radius-sm);
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
  background: var(--bg-surface);
  border: 1px solid var(--border-color);
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.18s ease-out;
  display: flex;
  align-items: center;
  gap: 4px;
}

.week-pill:hover {
  background: var(--bg-subtle);
  color: var(--text-primary);
}

.week-pill.active {
  background: var(--text-primary);
  color: var(--bg-main);
  border-color: var(--text-primary);
  font-weight: 600;
}

.week-pill.current-tag:not(.active) {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--accent-light);
}

/* ==========================================
   视图切换 (View Tabs)
   ========================================== */
.view-content {
  display: none;
  opacity: 0;
  animation: fadeInContent 0.22s ease-out forwards;
}

.view-content.active {
  display: block;
}

@keyframes fadeInContent {
  from {
    opacity: 0;
    transform: translateY(4px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* ==========================================
   视图 1: 今日日程 (Today View) - 紧凑不滚动布局
   ========================================== */
.today-summary-card {
  background: var(--bg-surface);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  margin-bottom: 10px;
  position: relative;
  transition: all 0.2s ease-out;
}

.today-date-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 4px;
  gap: 8px;
}

.today-date {
  font-size: 16px;
  font-weight: 600;
  letter-spacing: -0.01em;
  color: var(--text-primary);
}

.today-week-badge {
  font-size: 11px;
  padding: 2px 8px;
  background: var(--bg-subtle);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-full);
  color: var(--text-secondary);
  font-weight: 500;
}

.today-status-text {
  font-size: 12.5px;
  color: var(--text-secondary);
  line-height: 1.4;
}

.today-status-text strong {
  color: var(--text-primary);
  font-weight: 600;
}

/* 星期快捷切换按键 */
.weekday-switcher {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 4px;
  margin-bottom: 10px;
}

.weekday-btn {
  background: var(--bg-surface);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-xs);
  padding: 5px 1px;
  text-align: center;
  font-size: 11.5px;
  font-weight: 500;
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 0.18s ease-out;
  line-height: 1.2;
}

.weekday-btn:hover {
  background: var(--bg-subtle);
  color: var(--text-primary);
}

.weekday-btn.active {
  background: var(--text-primary);
  color: var(--bg-main);
  border-color: var(--text-primary);
  font-weight: 600;
}

.weekday-btn.active span {
  color: var(--bg-main) !important;
  opacity: 0.85;
}

.weekday-btn.today-highlight:not(.active) {
  border-color: var(--accent);
  background: var(--accent-light);
  color: var(--accent);
}

/* 今日课程列表 - 紧凑高度，单屏尽览 */
.timeline-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.course-item-card {
  background: var(--bg-surface);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-sm);
  padding: 8px 12px;
  display: flex;
  gap: 12px;
  cursor: pointer;
  transition: all 0.18s ease-out;
  position: relative;
  min-height: 52px;
}

.course-item-card:hover {
  border-color: var(--text-tertiary);
  background: var(--bg-surface);
}

.course-item-card:active {
  transform: translateY(1px);
}

.course-item-card.is-inactive {
  opacity: 0.55;
  background: var(--bg-subtle);
}

.course-item-left {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: flex-start;
  min-width: 68px;
  border-right: 1px solid var(--border-color);
  padding-right: 8px;
  flex-shrink: 0;
}

.time-slot-name {
  font-size: 10.5px;
  color: var(--text-tertiary);
  font-weight: 500;
  line-height: 1.2;
}

.time-slot-range {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-primary);
  font-variant-numeric: tabular-nums;
  margin-top: 1px;
  line-height: 1.2;
}

.course-item-body {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-width: 0;
}

.course-header-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 6px;
  margin-bottom: 3px;
}

.course-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text-primary);
  letter-spacing: -0.01em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.25;
}

.course-tag {
  font-size: 10px;
  padding: 1px 6px;
  border-radius: var(--radius-full);
  font-weight: 500;
  white-space: nowrap;
  line-height: 1.3;
}

.course-meta-row {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 11.5px;
  color: var(--text-secondary);
  flex-wrap: nowrap;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.2;
}

.meta-item {
  display: inline-flex;
  align-items: center;
  gap: 3px;
}

/* 空状态卡片 */
.empty-course-state {
  background: var(--bg-surface);
  border: 1px dashed var(--border-color);
  border-radius: var(--radius-sm);
  padding: 24px 16px;
  text-align: center;
}

.empty-icon {
  font-size: 28px;
  margin-bottom: 6px;
}

/* ==========================================
   视图 2: 周课表全景 (Weekly Grid View)
   上下撑满全屏、杜绝留空，单屏无滚动显示
   ========================================== */
#view-week.active {
  display: flex;
  flex-direction: column;
  flex: 1;
  min-height: calc(100dvh - var(--tab-bar-height) - 100px);
}

@supports not (height: 100dvh) {
  #view-week.active {
    min-height: calc(100vh - var(--tab-bar-height) - 100px);
  }
}

.grid-controls-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
  flex-wrap: wrap;
  gap: 8px;
  flex-shrink: 0;
}

.grid-filter-btn {
  font-size: 11.5px;
  padding: 4px 10px;
  border-radius: var(--radius-sm);
  background: var(--bg-surface);
  border: 1px solid var(--border-color);
  color: var(--text-secondary);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  transition: all 0.18s ease-out;
}

.grid-filter-btn:hover {
  background: var(--bg-subtle);
  color: var(--text-primary);
}

.grid-filter-btn.active {
  background: var(--bg-subtle);
  border-color: var(--border-color);
  color: var(--text-primary);
  font-weight: 600;
}

/* 填满整个剩余高度的包裹器 */
.timetable-scroll-wrapper {
  flex: 1;
  display: flex;
  flex-direction: column;
  width: 100%;
  border-radius: var(--radius-sm);
  background: var(--border-color);
  border: 1px solid var(--border-color);
  overflow: hidden;
  min-height: 0;
}

/* 核心网格：各节次比例填满整屏 (auto 顶部日期 + 5行等分 1fr) */
.timetable-grid {
  display: grid;
  grid-template-columns: 32px repeat(5, minmax(0, 1fr));
  grid-template-rows: 28px repeat(5, 1fr);
  width: 100%;
  flex: 1;
  height: 100%;
  min-height: 0;
  gap: 1px;
}

.show-weekends .timetable-grid {
  grid-template-columns: 26px repeat(7, minmax(0, 1fr));
  grid-template-rows: 28px repeat(5, 1fr);
  width: 100%;
  flex: 1;
  height: 100%;
  min-height: 0;
}

.grid-header-cell {
  background: var(--bg-subtle);
  padding: 3px 1px;
  text-align: center;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-primary);
  line-height: 1.2;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.grid-header-cell.is-today {
  background: var(--accent-light);
  color: var(--accent);
}

.grid-time-cell {
  background: var(--bg-subtle);
  padding: 3px 1px;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  color: var(--text-secondary);
  line-height: 1.15;
  height: 100%;
}

.grid-time-slot {
  font-size: 8px;
  font-variant-numeric: tabular-nums;
  opacity: 0.85;
  letter-spacing: -0.3px;
  transform: scale(0.92);
}

.grid-course-slot {
  background: var(--bg-surface);
  height: 100%;
  min-height: 0;
  padding: 2px;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.grid-card {
  flex: 1;
  height: 100%;
  border-radius: var(--radius-xs);
  padding: 4px 3px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  cursor: pointer;
  transition: all 0.18s ease-out;
  border: 1px solid transparent;
  min-height: 0;
}

.grid-card:hover {
  filter: brightness(0.97);
}

.grid-card:active {
  transform: translateY(1px);
}

.grid-card-name {
  font-size: 10.5px;
  font-weight: 600;
  line-height: 1.25;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  word-break: break-all;
}

.grid-card-time {
  font-size: 8px;
  font-weight: 500;
  opacity: 0.8;
  margin: 1px 0;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.4px;
  white-space: nowrap;
  overflow: hidden;
}

.grid-card-room {
  font-size: 9px;
  opacity: 0.85;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.1;
}

.grid-card.inactive-week {
  opacity: 0.35;
  filter: grayscale(0.7);
  border: 1px dashed var(--border-color);
}

/* 移动端视口优化 (<= 640px) */
@media (max-width: 640px) {
  .app-container {
    padding: 0 6px;
    padding-bottom: calc(var(--tab-bar-height) + 8px);
  }
  .app-header {
    padding: 10px 0 6px;
    margin-bottom: 8px;
  }
}

/* 桌面/平板屏幕 (>= 768px) */
@media (min-width: 768px) {
  #view-week.active {
    min-height: 640px;
  }
  .timetable-grid {
    grid-template-columns: 56px repeat(5, minmax(0, 1fr));
    grid-template-rows: 36px repeat(5, 1fr);
  }
  .show-weekends .timetable-grid {
    grid-template-columns: 48px repeat(7, minmax(0, 1fr));
    grid-template-rows: 36px repeat(5, 1fr);
  }
  .grid-header-cell {
    padding: 8px 4px;
    font-size: 12.5px;
  }
  .grid-time-cell {
    padding: 6px 3px;
    font-size: 11px;
  }
  .grid-card {
    padding: 6px 7px;
    border-radius: var(--radius-sm);
  }
  .grid-card-name {
    font-size: 12px;
    line-height: 1.35;
  }
  .grid-card-time {
    font-size: 9.5px;
    margin: 2px 0;
  }
  .grid-card-room {
    font-size: 10.5px;
  }
}

/* ==========================================
   移动端底部导航栏 (Mobile Tab Bar)
   ========================================== */
.bottom-tab-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: var(--tab-bar-height);
  background: var(--bg-surface);
  border-top: 1px solid var(--border-color);
  display: flex;
  justify-content: space-around;
  align-items: center;
  z-index: 60;
}

@media (min-width: 768px) {
  .bottom-tab-bar {
    display: none;
  }
}

.bottom-tab-bar .tab-btn {
  flex: 1;
  height: 100%;
  border: none;
  background: transparent;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  color: var(--text-secondary);
  font-size: 11px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.18s ease-out;
}

.bottom-tab-bar .tab-btn.active {
  color: var(--accent);
  font-weight: 600;
}

.tab-icon {
  font-size: 18px;
}

/* ==========================================
   模态弹窗 (Modal / Bottom Sheet)
   ========================================== */
.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0, 0, 0, 0.4);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  z-index: 100;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease-out;
}

.modal-overlay.active {
  opacity: 1;
  pointer-events: auto;
}

.modal-sheet {
  background: var(--bg-surface);
  border: 1px solid var(--border-color);
  border-top-left-radius: var(--radius-lg);
  border-top-right-radius: var(--radius-lg);
  width: 100%;
  max-width: 540px;
  padding: 24px;
  transform: translateY(100%);
  transition: transform 0.22s ease-out;
  max-height: 85vh;
  overflow-y: auto;
}

@media (min-width: 768px) {
  .modal-overlay {
    align-items: center;
  }
  .modal-sheet {
    border-radius: var(--radius-lg);
    transform: translateY(12px);
  }
}

.modal-overlay.active .modal-sheet {
  transform: translateY(0);
}

.sheet-handle {
  width: 36px;
  height: 4px;

        return { section: 1, periods: '1-2节', start: '08:20', end: '10:00', timeDesc: '08:20 - 10:00', part: 'morning' };

        return { section: 2, periods: '3-4节', start: '10:30', end: '12:10', timeDesc: '10:30 - 12:10', part: 'morning' };
      } else if (section === 3) {
        if (isFriOrSat) {
          return { section: 3, periods: '5-6节', start: '13:10', end: '14:50', timeDesc: '13:10 - 14:50', part: 'afternoon', note: '周五/六下午作息' };
        }
        return isSummer
          ? { section: 3, periods: '5-6节', start: '14:30', end: '16:10', timeDesc: '14:30 - 16:10', part: 'afternoon', note: '夏季作息' }
          : { section: 3, periods: '5-6节', start: '14:00', end: '15:40', timeDesc: '14:00 - 15:40', part: 'afternoon', note: '冬季作息' };
      } else if (section === 4) {

    function calculateCurrentWeek(startDateStr) {
      const base = startDateStr || DEFAULT_SEMESTER_START_DATE;
      const [y, m, d] = base.split('-').map(Number);
      const start = new Date(y, m - 1, d);
      const now = new Date();
      const startZero = new Date(start.getFullYear(), start.getMonth(), start.getDate());
      const nowZero = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const diffDays = Math.floor((nowZero - startZero) / (1000 * 60 * 60 * 24));
      if (diffDays < 0) return 1;
      const weekNum = Math.floor(diffDays / 7) + 1;
      return Math.min(Math.max(weekNum, 1), 20);
    }

    function getCurrentDayOfWeek() {
      const day = new Date().getDay();
      return day === 0 ? 7 : day;
    }

    function getDateByWeekAndDay(startDateStr, week, day) {
      const base = startDateStr || DEFAULT_SEMESTER_START_DATE;
      const [y, m, d] = base.split('-').map(Number);
      const start = new Date(y, m - 1, d);
      const daysOffset = (week - 1) * 7 + (day - 1);
      start.setDate(start.getDate() + daysOffset);
      return start;
    }

    function formatDateString(date) {
      const pad = (n) => String(n).padStart(2, '0');
      return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
    }

    function getHolidayInfo(dateStr) {
      for (const h of HOLIDAYS) {
        if (dateStr >= h.startDate && dateStr <= h.endDate) return h;
      }
      return null;
    }

    function getAdjustmentInfo(dateStr) {
      for (const adj of ADJUSTMENTS) {
        if (dateStr === adj.date) return adj;
      }
      return null;
    }

    function getStorage(key, fallback) {
      try {
        const val = localStorage.getItem(key);
        return val !== null ? val : fallback;
      } catch (e) {
        return fallback;
      }
    }

    function setStorage(key, val) {
      try { localStorage.setItem(key, val); } catch (e) {}
    }

      if (isDark) {
        document.documentElement.setAttribute('data-theme', 'dark');
      } else {
        document.documentElement.removeAttribute('data-theme');
      }

          } else {

        const activePill = scroller ? scroller.querySelector('.week-pill.active') : null;
        if (activePill) {
          activePill.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
        }
        const gridWrapper = document.getElementById('timetable-scroll-wrapper');
        const todayCell = gridWrapper ? gridWrapper.querySelector('.grid-header-cell.is-today') : null;
        if (todayCell && gridWrapper) {
          gridWrapper.scrollTo({ left: Math.max(0, todayCell.offsetLeft - 50), behavior: 'smooth' });
        }
      }, 50);
    };

    window.goToWeek = function(weekNum) {
      state.selectedWeek = Number(weekNum);
      renderWeekScroller();
      renderTodayView();
      renderWeekGrid();
    };

    function renderAll() {
      renderWeekScroller();
      renderTodayView();
      renderWeekGrid();
    }

    function renderWeekScroller() {
      const container = document.getElementById('week-scroller');
      if (!container) return;

      container.innerHTML = '';
      for (let w = 1; w <= 18; w++) {
        const pill = document.createElement('button');
        const isSelected = (w === state.selectedWeek);
        const isCurrentRealWeek = (w === state.currentWeek);
        
        pill.className = `week-pill ${isSelected ? 'active' : ''} ${isCurrentRealWeek ? 'current-tag' : ''}`;
        
        let extraTag = '';
        if (w === 4) extraTag = ' 🥮中秋';
        else if (w === 5) extraTag = ' 🇨🇳国庆';
        else if (w === 6) extraTag = ' ⏰调休';
        else if (isCurrentRealWeek) extraTag = ' (本周)';

        pill.innerText = `第 ${w} 周${extraTag}`;
        pill.onclick = () => {
          state.selectedWeek = w;
          renderWeekScroller();
          renderTodayView();
          renderWeekGrid();
        };
        container.appendChild(pill);
      }

      const activePill = container.querySelector('.week-pill.active');
      if (activePill) {
        activePill.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
      }
    }

    function getClassTimeStatus(slot) {
      const now = new Date();
      const currentMins = now.getHours() * 60 + now.getMinutes();

      const [startH, startM] = slot.start.split(':').map(Number);
      const [endH, endM] = slot.end.split(':').map(Number);
      const startMins = startH * 60 + startM;
      const endMins = endH * 60 + endM;

      if (currentMins < startMins) {
        const diff = startMins - currentMins;
        return { status: 'upcoming', label: `待上课 · ${diff}分钟后`, diff };
      } else if (currentMins >= startMins && currentMins <= endMins) {
        const remain = endMins - currentMins;
        return { status: 'ongoing', label: `🔴 上课中 · 剩${remain}分钟`, remain };
      } else {
        return { status: 'finished', label: '✔️ 已结课' };
      }
    }

    function renderTodayView() {
      const container = document.getElementById('today-course-list');
      const summaryBox = document.getElementById('today-summary-box');
      const daySwitcher = document.getElementById('weekday-switcher');
      if (!container || !summaryBox || !daySwitcher) return;

      daySwitcher.innerHTML = WEEK_DAYS.map(d => {
        const isRealToday = (d.day === state.todayDay && state.selectedWeek === state.currentWeek);
        const isSelected = d.day === state.selectedDay;
        const dayDate = getDateByWeekAndDay(state.semesterStartDate, state.selectedWeek, d.day);
        const dateStr = formatDateString(dayDate);
        const hol = getHolidayInfo(dateStr);
        const adj = getAdjustmentInfo(dateStr);

        let badge = '';
        if (hol) badge = `<span style="font-size:9px; display:block; color:#ef4444; font-weight:600;">${hol.name.slice(0,2)}</span>`;
        else if (adj) badge = `<span style="font-size:9px; display:block; color:#f59e0b; font-weight:600;">调休</span>`;
        else badge = `<span style="font-size:9px; display:block; opacity:0.6;">${dayDate.getMonth()+1}/${dayDate.getDate()}</span>`;

        return `
          <button class="weekday-btn ${isSelected ? 'active' : ''} ${isRealToday ? 'today-highlight' : ''}" data-day="${d.day}">
            <div>${d.name}</div>
            ${badge}
          </button>
        `;
      }).join('');

      daySwitcher.querySelectorAll('.weekday-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          state.selectedDay = Number(btn.dataset.day);
          renderTodayView();
        });
      });

      const targetDate = getDateByWeekAndDay(state.semesterStartDate, state.selectedWeek, state.selectedDay);
      const targetDateStr = formatDateString(targetDate);
      const holiday = getHolidayInfo(targetDateStr);
      const adjustment = getAdjustmentInfo(targetDateStr);

      const currentDayName = WEEK_DAYS.find(d => d.day === state.selectedDay)?.full || '';
      const isActualToday = (state.selectedDay === state.todayDay && state.selectedWeek === state.currentWeek);
      const dateFormatted = `${targetDate.getFullYear()}年${targetDate.getMonth() + 1}月${targetDate.getDate()}日`;

      let dayCourses = [];
      if (adjustment) {
        dayCourses = RAW_COURSES.filter(c => c.day === adjustment.replaceDay);
      } else {
        dayCourses = RAW_COURSES.filter(c => c.day === state.selectedDay);
      }

      const activeDayCourses = holiday ? [] : dayCourses.filter(c => isCourseActiveInWeek(c, state.selectedWeek));
      activeDayCourses.sort((a, b) => a.section - b.section);
      dayCourses.sort((a, b) => a.section - b.section);

      let liveStatusText = '';
      let ongoingCourse = null;
      let nextCourse = null;

      if (isActualToday && activeDayCourses.length > 0 && !holiday) {
        for (const c of activeDayCourses) {
          const slot = getTimeSlot(c.section, targetDateStr, state.selectedDay);
          if (slot) {
            const timeStat = getClassTimeStatus(slot);
            if (timeStat.status === 'ongoing' && !ongoingCourse) {
              ongoingCourse = { course: c, slot, timeStat };
            } else if (timeStat.status === 'upcoming' && !nextCourse) {
              nextCourse = { course: c, slot, timeStat };
            }
          }
        }

        if (ongoingCourse) {
          liveStatusText = `<span style="color:var(--accent);font-weight:600;">● 正在上课</span>：<strong>${ongoingCourse.course.name}</strong> (${ongoingCourse.course.room}) · 剩 ${ongoingCourse.timeStat.remain} 分钟下课`;
        } else if (nextCourse) {
          liveStatusText = `<span style="color:var(--status-upcoming);font-weight:600;">○ 下一节课</span>：<strong>${nextCourse.slot.start} ${nextCourse.course.name}</strong> · ${nextCourse.course.room}`;
        } else {
          liveStatusText = `今日课程已全部结束，享受安静的自主时间。`;
        }
      } else if (holiday) {
        liveStatusText = `${holiday.desc}，祝假期愉快。`;
      } else if (adjustment) {
        liveStatusText = `${adjustment.desc}，请按时出勤。`;
      } else {
        liveStatusText = activeDayCourses.length > 0 
          ? `今日共安排 <strong>${activeDayCourses.length}</strong> 门课程，请从容前往教室。` 
          : `本日无上课安排，可在自习室阅读或休息充能。`;
      }

      summaryBox.innerHTML = `
        <div class="today-date-row">
          <div class="today-date">
            ${isActualToday ? '今天 · ' : ''}${dateFormatted} ${currentDayName}
          </div>
          <div style="display:flex; align-items:center; gap:8px;">
            ${!isActualToday ? `<button onclick="window.goToToday()" class="icon-btn" style="height:28px; font-size:12px; padding:0 10px; border-radius:var(--radius-sm); width:auto; background:var(--bg-subtle); color:var(--text-primary); border:1px solid var(--border-color); cursor:pointer;">回到今天</button>` : ''}
            <span class="today-week-badge">第 ${state.selectedWeek} 周 ${isActualToday ? '(本周)' : ''}</span>
          </div>
        </div>
        <div class="today-status-text">
          ${liveStatusText}
        </div>
      `;

      if (holiday) {
        container.innerHTML = `
          <div class="empty-course-state" style="border-color: var(--accent-border); background: var(--accent-light);">
            <div class="empty-icon">${holiday.icon}</div>
            <h3 style="font-size: 17px; font-weight:600; color:var(--accent);">${holiday.name}放假中</h3>
            <p style="font-size: 13px; color: var(--text-secondary); margin-top: 6px;">${holiday.desc}</p>
          </div>
        `;
        return;
      }

      if (dayCourses.length === 0 || activeDayCourses.length === 0) {
        const isWeek1 = (state.selectedWeek === 1);
        container.innerHTML = `
          <div class="empty-course-state">
            <div class="empty-icon">☕</div>
            <h3 style="font-size: 17px; font-weight:600; margin-bottom: 6px;">本日无课程安排</h3>
            <p style="font-size: 13px; color: var(--text-secondary); margin-bottom: 16px;">
              ${isWeek1 ? '学期正式课程将于 9月7日（第 2 周）开始' : '享受阅读、自习或课余时光'}
            </p>
            ${isWeek1 ? `<button onclick="window.goToWeek(2)" class="primary-btn" style="width:auto; padding:0 22px; margin:0 auto; font-size:13px;">查看第 2 周课表</button>` : ''}
          </div>
        `;
        return;
      }

      const inactiveCourses = dayCourses.filter(c => !isCourseActiveInWeek(c, state.selectedWeek));
      const coursesToShow = state.showTodayInactive ? dayCourses : activeDayCourses;

      let listHtml = coursesToShow.map(course => {
        const isActive = isCourseActiveInWeek(course, state.selectedWeek);
        const slot = getTimeSlot(course.section, targetDateStr, state.selectedDay);
        const color = COURSE_COLORS[course.name] || { bg: 'var(--bg-subtle)', border: 'var(--border-color)', text: 'var(--text-primary)', solid: 'var(--accent)' };

        let liveBadge = '';
        if (isActualToday && isActive && slot.start) {
          const timeStat = getClassTimeStatus(slot);
          if (timeStat.status === 'ongoing') {
            liveBadge = `<span class="course-tag" style="background:var(--accent-light); color:var(--accent); border:1px solid var(--accent-border); font-weight:600;">正在上课</span>`;
          } else if (timeStat.status === 'upcoming') {
            liveBadge = `<span class="course-tag" style="background:var(--bg-subtle); color:var(--status-upcoming); border:1px solid var(--border-color);">待上课</span>`;
          } else if (timeStat.status === 'finished') {
            liveBadge = `<span class="course-tag" style="background:var(--bg-subtle); color:var(--text-tertiary); border:1px solid var(--border-color);">已结课</span>`;
          }
        }

        return `
          <div class="course-item-card ${isActive ? '' : 'is-inactive'}" onclick="window.showCourseDetail('${course.id}')" style="border-left: 3.5px solid ${isActive ? color.solid : 'var(--border-color)'};">
            <div class="course-item-left">
              <span class="time-slot-name">${course.periods}</span>
              <span class="time-slot-range">${slot.start}-${slot.end}</span>
            </div>
            <div class="course-item-body">
              <div class="course-header-row">
                <div class="course-title" style="color: var(--text-primary);">
                  ${adjustment ? `<span style="font-size:11px; color:var(--accent);">[调] </span>` : ''}${course.name}
                </div>
                <div style="display:flex; align-items:center; gap:4px;">
                  ${liveBadge}
                  <span class="course-tag" style="background: ${isActive ? color.bg : 'var(--bg-subtle)'}; color: ${isActive ? color.text : 'var(--text-tertiary)'}; border: 1px solid ${isActive ? color.border : 'var(--border-color)'};">
                    ${isActive ? '本周有课' : '非本周'}
                  </span>
                </div>
              </div>
              <div class="course-meta-row">
                <span class="meta-item">📍<strong>${course.room}</strong></span>
                <span class="meta-item">👨‍🏫${course.teacher}</span>
                <span class="meta-item">📅${course.weeksRaw}</span>
              </div>
            </div>
          </div>
        `;
      }).join('');

      if (inactiveCourses.length > 0) {
        listHtml += `
          <div style="text-align: center; padding: 6px 0 2px;">
            <button onclick="window.toggleTodayInactive()" class="grid-filter-btn" style="margin: 0 auto; font-size: 11px;">
              ${state.showTodayInactive ? '收起非本周课程' : `查看非本周课程 (${inactiveCourses.length}门)`}
            </button>
          </div>
        `;
      }

      container.innerHTML = listHtml;
    }

    function renderWeekGrid() {
      const container = document.getElementById('timetable-grid-content');
      const wrapper = document.getElementById('timetable-scroll-wrapper');
      if (!container || !wrapper) return;

      const isWeek6 = state.selectedWeek === 6;
      const shouldShowWeekends = state.showWeekends || isWeek6;

      wrapper.classList.toggle('show-weekends', shouldShowWeekends);
      const totalDays = shouldShowWeekends ? 7 : 5;

      let gridHtml = `<div class="grid-header-cell" style="font-size: 10px;">节次</div>`;
      for (let d = 1; d <= totalDays; d++) {
        const isRealToday = (d === state.todayDay && state.selectedWeek === state.currentWeek);
        const colDate = getDateByWeekAndDay(state.semesterStartDate, state.selectedWeek, d);
        const colDateStr = formatDateString(colDate);
        const colHoliday = getHolidayInfo(colDateStr);
        const colAdj = getAdjustmentInfo(colDateStr);

        let subText = `${colDate.getMonth()+1}/${colDate.getDate()}`;
        if (colHoliday) subText = `<span style="color:#ef4444;font-weight:700;">${colHoliday.name.slice(0,2)}</span>`;
        if (colAdj) subText = `<span style="color:#d97706;font-weight:700;">调休</span>`;

        gridHtml += `
          <div class="grid-header-cell ${isRealToday ? 'is-today' : ''}">
            <div>${WEEK_DAYS[d - 1].name}</div>
            <div style="font-size:9px;opacity:0.75;margin-top:1px;">${subText}</div>
          </div>
        `;
      }

      // 计算当前所查看周的代表日期（周一），获取该周的夏/冬季作息
      const weekMonDate = getDateByWeekAndDay(state.semesterStartDate, state.selectedWeek, 1);
      const weekMonDateStr = formatDateString(weekMonDate);
      const isSummerWeek = (weekMonDateStr.slice(5) >= '05-01' && weekMonDateStr.slice(5) < '10-01');

      [1, 2, 3, 4, 5].forEach(section => {
        const refSlot = getTimeSlot(section, weekMonDateStr, 1);

        gridHtml += `
          <div class="grid-time-cell">
            <span style="font-weight:700;">${section * 2 - 1}-${section * 2}</span>
            <span class="grid-time-slot">${refSlot.start}</span>
            <span class="grid-time-slot">${refSlot.end}</span>
            <span style="font-size:9px; color:var(--text-secondary); margin-top:2px;">${isSummerWeek ? '夏季' : '冬季'}</span>
          </div>
        `;

        for (let d = 1; d <= totalDays; d++) {
          const colDate = getDateByWeekAndDay(state.semesterStartDate, state.selectedWeek, d);
          const colDateStr = formatDateString(colDate);
          const colHoliday = getHolidayInfo(colDateStr);
          const colAdj = getAdjustmentInfo(colDateStr);

          gridHtml += `<div class="grid-course-slot">`;

          if (colHoliday) {
            gridHtml += `
              <div style="font-size:11px; color:var(--accent); text-align:center; padding:10px 2px; height:100%; display:flex; align-items:center; justify-content:center; font-weight:500;">
                ${colHoliday.name}放假
              </div>
            `;
          } else {
            let targetDay = d;
            if (colAdj) {
              targetDay = colAdj.replaceDay;
            }

            const cellCourses = RAW_COURSES.filter(c => c.day === targetDay && c.section === section);

            if (cellCourses.length > 0) {
              const activeCourses = cellCourses.filter(c => isCourseActiveInWeek(c, state.selectedWeek));
              const coursesToDisplay = (state.filterOnlyActiveGrid && activeCourses.length > 0) 
                ? activeCourses 
                : cellCourses;

              coursesToDisplay.forEach(c => {
                const isActive = isCourseActiveInWeek(c, state.selectedWeek);
                const cardSlot = getTimeSlot(c.section, colDateStr, targetDay);
                const color = COURSE_COLORS[c.name] || { bg: 'var(--bg-subtle)', border: 'var(--border-color)', text: 'var(--text-primary)', solid: 'var(--accent)' };
                
                gridHtml += `
                  <div class="grid-card ${isActive ? '' : 'inactive-week'}" 
                       onclick="window.showCourseDetail('${c.id}')"
                       style="background: ${color.bg}; border-color: ${color.border}; color: ${color.text};">
                    <div class="grid-card-name">${colAdj ? '[调] ' : ''}${c.name}</div>
                    <div class="grid-card-time">${cardSlot.start}-${cardSlot.end}</div>
                    <div class="grid-card-room">${c.room}</div>
                  </div>
                `;
              });
            }
          }

          gridHtml += `</div>`;
        }
      });

      container.innerHTML = gridHtml;

      // 更新顶部周课表标题与快速回到本周按钮
      const gridTitle = document.getElementById('week-grid-title');
      const backTodayBtn = document.getElementById('week-back-today-btn');
      if (gridTitle) {
        gridTitle.innerText = `第 ${state.selectedWeek} 周课表 ${state.selectedWeek === state.currentWeek ? '(本周)' : ''}`;
      }
      if (backTodayBtn) {
        backTodayBtn.innerText = '回到本周';
        backTodayBtn.style.display = (state.selectedWeek !== state.currentWeek) ? 'inline-flex' : 'none';
      }
    }

    window.showCourseDetail = function(courseId) {
      const course = RAW_COURSES.find(c => c.id === courseId);
      if (!course) return;

      const modal = document.getElementById('course-detail-modal');
      const title = document.getElementById('detail-modal-title');
      const content = document.getElementById('detail-modal-content');
      if (!modal || !title || !content) return;

      const targetDate = getDateByWeekAndDay(state.semesterStartDate, state.selectedWeek, state.selectedDay);
      const targetDateStr = formatDateString(targetDate);
      const dayName = WEEK_DAYS.find(d => d.day === course.day)?.full || '';
      const slot = getTimeSlot(course.section, targetDateStr, course.day);
      const color = COURSE_COLORS[course.name] || { solid: '#4f46e5' };

      title.innerHTML = `<span style="color: ${color.solid}">${course.name}</span>`;
      
      content.innerHTML = `
        <div class="detail-item-card">
          <div class="detail-icon">📍</div>
          <div>
            <div class="detail-label">上课地点 / 教室</div>
            <div class="detail-val">${course.room}</div>
          </div>
        </div>
        <div class="detail-item-card">
          <div class="detail-icon">👨‍🏫</div>
          <div>
            <div class="detail-label">任课教师</div>
            <div class="detail-val">${course.teacher}</div>
          </div>
        </div>
        <div class="detail-item-card">
          <div class="detail-icon">⏰</div>
          <div>
            <div class="detail-label">上课时间</div>
            <div class="detail-val">${dayName} ${course.periods} (${slot.timeDesc}${slot.note ? ` · ${slot.note}` : ''})</div>
          </div>
        </div>
        <div class="detail-item-card">
          <div class="detail-icon">📅</div>
          <div>
            <div class="detail-label">排课周次规则</div>
            <div class="detail-val">${course.weeksRaw}</div>
            <div style="font-size: 11px; color: var(--text-muted); margin-top: 2px;">
              包含周次: ${course.weeks.map(w => `第${w}周`).join(', ')}
            </div>
          </div>
        </div>
        <div class="detail-item-card">
          <div class="detail-icon">🏷️</div>
          <div>
            <div class="detail-label">课程性质 / 备注</div>
            <div class="detail-val">${course.type}</div>
          </div>
        </div>
        <button class="primary-btn" onclick="navigator.clipboard && navigator.clipboard.writeText('${course.name} 教室:${course.room} 老师:${course.teacher} 时间:${dayName} ${course.periods} (${slot.timeDesc})'); alert('课程信息已复制到剪贴板！');">
          📋 复制课程信息
        </button>
      `;

      modal.classList.add('active');
    };

    function closeModals() {
      document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('active'));
    }

    function startStatusTicker() {
      setInterval(() => {
        if (state.activeTab === 'today') renderTodayView();
      }, 30000);
    }

    function init() {
      initTheme();
      refreshRealTimeState();
      bindEvents();
      renderAll();
      startStatusTicker();
    }

    // 禁止双指手势缩放 (Pinch-to-zoom / Gesture zoom)，同时完全保留单指原生平滑滑动与下拉刷新 (Pull-to-refresh)
    (function disableZoom() {
      // 拦截双指/多指捏合触摸 (不影响单指下拉与滑动)
      document.addEventListener('touchstart', function(e) {
        if (e.touches && e.touches.length > 1) {
          e.preventDefault();
        }
      }, { passive: false });

      // 拦截 Safari 双指手势缩放
      document.addEventListener('gesturestart', function(e) {
        e.preventDefault();
      }, { passive: false });

      document.addEventListener('gesturechange', function(e) {
        e.preventDefault();
      }, { passive: false });

      document.addEventListener('gestureend', function(e) {
        e.preventDefault();
      }, { passive: false });
    })();

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  })();
  </script>
</body>
</html>
