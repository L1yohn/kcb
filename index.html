<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>我的课程表 - 手机移动端查询系统</title>
  <meta name="description" content="专为手机端优化的大学课程表查询系统，支持周次切换、实时日程、周视图网格与日历导出。">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">
</head>
<body>

  <div class="app-container">
    <!-- 顶部导航栏 -->
    <header class="app-header">
      <div class="header-top">
        <div class="brand-info">
          <div class="brand-icon">📚</div>
          <div class="brand-title">学期课程表</div>
        </div>
        <div class="header-actions">
          <button class="icon-btn" id="share-btn" title="手机扫码查看" aria-label="手机扫码查看">📱</button>
          <button class="icon-btn" id="theme-toggle-btn" title="切换暗黑/浅色模式" aria-label="切换主题">🌓</button>
        </div>
      </div>

      <!-- 顶部周次快捷滑动选择条 -->
      <div id="week-scroller-wrap" class="week-scroller-container">
        <div id="week-scroller" class="week-scroller-container"></div>
      </div>
    </header>

    <!-- 视图 1: 今日日程 (Today View) -->
    <main id="view-today" class="view-content active">
      <div id="today-summary-box" class="today-summary-card"></div>

      <!-- 星期一 ~ 星期日 快捷切换按钮 -->
      <div id="weekday-switcher" class="weekday-switcher"></div>

      <!-- 课程卡片时间轴列表 -->
      <div id="today-course-list" class="timeline-list"></div>
    </main>

    <!-- 视图 2: 周课表网格 (Weekly Grid View) -->
    <main id="view-week" class="view-content">
      <div class="grid-controls-bar">
        <span style="font-size: 13px; font-weight: 600; color: var(--text-muted);">🗓️ 本周全景课表</span>
        <button class="grid-filter-btn active" id="grid-toggle-filter" onclick="
          window.state = window.state || {};
          this.classList.toggle('active');
          const isOnly = this.classList.contains('active');
          this.innerText = isOnly ? '✅ 仅看本周有课' : '👀 显示所有周课程';
        ">
          ✅ 仅看本周有课
        </button>
      </div>

      <div id="timetable-scroll-wrapper" class="timetable-scroll-wrapper">
        <div id="timetable-grid-content" class="timetable-grid"></div>
      </div>
    </main>

    <!-- 底部 Tab 导航栏 -->
    <nav class="bottom-tab-bar">
      <button class="tab-btn active" data-tab="today">
        <span class="tab-icon">📅</span>
        <span class="tab-label">今日日程</span>
      </button>
      <button class="tab-btn" data-tab="week">
        <span class="tab-icon">🗓️</span>
        <span class="tab-label">周课表</span>
      </button>
    </nav>
  </div>

  <!-- 课程详情弹窗 Modal (Bottom Sheet) -->
  <div id="course-detail-modal" class="modal-overlay">
    <div class="modal-sheet">
      <div class="sheet-handle"></div>
      <div class="modal-header">
        <div class="modal-title" id="detail-modal-title">课程详情</div>
        <button class="modal-close-btn" aria-label="关闭">&times;</button>
      </div>
      <div id="detail-modal-content"></div>
    </div>
  </div>

  <!-- 手机扫码分享弹窗 -->
  <div id="share-modal" class="modal-overlay">
    <div class="modal-sheet">
      <div class="sheet-handle"></div>
      <div class="modal-header">
        <div class="modal-title">📱 手机扫码访问</div>
        <button class="modal-close-btn" aria-label="关闭">&times;</button>
      </div>
      <div class="qr-preview-box" id="share-qr-code"></div>
      <div style="font-size: 11px; color: var(--text-muted); word-break: break-all; text-align: center; margin-top: 6px;" id="share-url-text"></div>
      <button class="secondary-btn" onclick="document.getElementById('share-modal').classList.remove('active')">关闭</button>
    </div>
  </div>

  <!-- 引入 JavaScript 脚本 -->
  <script src="js/qrcode.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/ics.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
